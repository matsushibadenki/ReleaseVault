[package]
name = "releasevault"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = {version = "1", features= ["derive"] }
serde_json = "1"
rusqlite = {version="0.32",features= ["bundled"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = {version="1",features= ["derive"] }
rand = "0.8"
base64 = "0.22"
rfd = "0.15"
chrono = "0.4"
tempfile = "3"
minisign-verify = "0.2"
csv = "1"
minisign = "0.9"
x509-parser = "0.18"
open = "5"
semver="1"
[profile.dev]
debug = 0
